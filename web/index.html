<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harmonic — machine health, diagnosis and maintenance reports for rotating equipment." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Harmonic · Machine health</title>
    <script>
      // Apply the saved theme before first paint, so a light-theme user never
      // sees a dark flash.
      try {
        const t = localStorage.getItem("harmonic-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
